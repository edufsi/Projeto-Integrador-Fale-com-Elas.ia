[CHAT_API]
DEFAULT_MODEL_PROFILE = local-qwen
DEFAULT_ASSISTANT_PROFILE = acolhimento-juridico-v1
DEFAULT_MEMORY_PROFILE = recent-window-v1
DATABASE_PATH = ../../data/private/chat.sqlite3
HOST = 127.0.0.1
PORT = 8000
ALLOWED_ORIGINS = http://127.0.0.1:8765,http://localhost:8765
RECENT_MESSAGES = 6
SUMMARY_TRIGGER_MESSAGES = 12
SUMMARY_TRIGGER_TOKENS = 1800
MAX_MESSAGE_CHARS = 12000
LOCK_TIMEOUT_SECONDS = 30
MAX_TOOL_ROUNDS = 2
MAX_TOOL_CALLS = 3
TOOL_CONTEXT_BUDGET_TOKENS = 1600

[MCP]
LEGAL_URL = http://127.0.0.1:8001/mcp
TIMEOUT = 30

[MODEL.local-qwen]
PROVIDER = ollama
API_URL = http://127.0.0.1:11434/api/chat
MODEL = qwen3.5:4b
CONTEXT_BUDGET_TOKENS = 8192
MAX_OUTPUT_TOKENS = 512
TIMEOUT = 120
TEMPERATURE = 0.3
SUPPORTS_TOOLS = true

[MODEL.external-openai-compatible]
PROVIDER = openai_compatible
API_URL = https://exemplo.invalid/v1/chat/completions
MODEL = modelo-configurado
API_KEY_ENV = CHAT_EXTERNAL_API_KEY
CONTEXT_BUDGET_TOKENS = 8192
MAX_OUTPUT_TOKENS = 512
TIMEOUT = 120
TEMPERATURE = 0.3
SUPPORTS_TOOLS = true

[ASSISTANT.acolhimento-juridico-v1]
PROMPT_PATH = src/notas_ia/prompts/assistant.pt-BR.md
SUMMARY_PROMPT_PATH = src/notas_ia/prompts/summary.pt-BR.md

