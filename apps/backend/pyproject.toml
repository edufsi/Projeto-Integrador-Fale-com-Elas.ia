[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notas-ia-backend"
version = "0.2.0"
description = "API agentiva experimental do Notas.IA"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<2",
  "fastmcp>=4.1,<5",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
notas-ia = "notas_ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notas_ia = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

