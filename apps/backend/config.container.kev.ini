[CHAT_API]
DEFAULT_MODEL_PROFILE = local-qwen
DEFAULT_ASSISTANT_PROFILE = mprs-acolhimento-v2
DEFAULT_MEMORY_PROFILE = recent-window-v1
DATABASE_PATH = /data/private/chat.sqlite3
HOST = 0.0.0.0
PORT = 8000
ALLOWED_ORIGINS = http://127.0.0.1:8765,http://localhost:8765
RECENT_MESSAGES = 6
SUMMARY_TRIGGER_MESSAGES = 12
SUMMARY_TRIGGER_TOKENS = 1800
MAX_MESSAGE_CHARS = 12000
LOCK_TIMEOUT_SECONDS = 30
MAX_TOOL_ROUNDS = 2
MAX_TOOL_CALLS = 3
TOOL_CONTEXT_BUDGET_TOKENS = 1600

[CLASSIFICATION]
# Configuração específica do experimento simultâneo Qwen 4B + Kev 4B. Shadow evita
# que um classificador ainda não validado modifique a resposta do agente.
MODE = shadow
ONLINE_CLASSIFIERS = kev4b
# Em sombra a inferência é só auditoria e não existe fonte de contexto. A
# sobreposição compose.kev-context.yaml preenche este valor ao ativar agent_context.
AGENT_CONTEXT_CLASSIFIER =
TAXONOMY_VERSION = v1

[MCP]
LEGAL_URL = http://legal-mcp:8001/mcp
TIMEOUT = 30

[MODEL.local-qwen]
PROVIDER = ollama
API_URL = http://ollama:11434/api/chat
MODEL = qwen3.5:4b
# Mantém espaço para o cache KV de Qwen e Kev numa GPU de 8 GB. Não é uma garantia
# de que ambos caibam: o preflight e nvidia-smi continuam obrigatórios.
CONTEXT_BUDGET_TOKENS = 4096
MAX_OUTPUT_TOKENS = 256
TIMEOUT = 180
TEMPERATURE = 0.3
SUPPORTS_TOOLS = true

[MODEL.local-llama8]
PROVIDER = ollama
API_URL = http://ollama:11434/api/chat
MODEL = llama3.1:8b
CONTEXT_BUDGET_TOKENS = 4096
MAX_OUTPUT_TOKENS = 512
TIMEOUT = 180
TEMPERATURE = 0.2
SUPPORTS_TOOLS = true

[ASSISTANT.acolhimento-juridico-v1]
PROMPT_PATH = src/notas_ia/prompts/assistant.pt-BR.md
SUMMARY_PROMPT_PATH = src/notas_ia/prompts/summary.pt-BR.md

[ASSISTANT.mprs-acolhimento-v2]
PROMPT_PATH = src/notas_ia/prompts/mprs-acolhimento-v2.pt-BR.md
SUMMARY_PROMPT_PATH = src/notas_ia/prompts/summary.pt-BR.md

[CLASSIFIER.local-llama8]
KIND = llm
MODEL_PROFILE = local-llama8
MAX_OUTPUT_TOKENS = 500
TEMPERATURE = 0

[CLASSIFIER.local-qwen4]
KIND = llm
MODEL_PROFILE = local-qwen
MAX_OUTPUT_TOKENS = 500
TEMPERATURE = 0

[CLASSIFIER.kev4b]
KIND = system_one
API_URL = http://kev:8080/v1/systemone
# Deve coincidir com --alias no serviço kev, para que o servidor e o adaptador
# identifiquem o mesmo modelo sem depender de um caminho interno do container.
MODEL = ggml-org/Kev-4B-GGUF:Q4_K_M
TIMEOUT = 180
